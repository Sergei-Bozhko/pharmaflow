services:
  postgres:
    image: postgres:17-alpine
    container_name: pharmaflow-postgres-dev
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: pharmaflow
      POSTGRES_PASSWORD: pharmaflow
      POSTGRES_DB: pharmaflow_dev
    volumes:
      - pharmaflow-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharmaflow -d pharmaflow_dev"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pharmaflow-pg-data: