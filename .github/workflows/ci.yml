name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashfiles('**/Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      
      - name: Restore
        run: dotnet restore
      
      - name: Format check
        run: dotnet format --verify-no-changes
      
      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test (unit)
        run: dotnet test --project tests/PharmaFlow.Tests.Unit/PharmaFlow.Tests.Unit.csproj --no-build -c Release

      - name: Test (integration)
        run: dotnet test --project tests/PharmaFlow.Tests.Integration/PharmaFlow.Tests.Integration.csproj --no-build -c Release

      - name: Vulnerability scan
        run: |
          set -e
          output=$(dotnet list package --vulnerable --include-transitive 2>&1)
          echo "$output"
          if echo "$output" | grep -E '> (High|Critical)' >/dev/null; then
            echo "::error::High or Critical vulnerability detected"
            exit 1
          fi